<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — FinTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-logo">🔑</span>
                <h1>Reset Password</h1>
                <p>Enter the code sent to <strong style="color: #38bdf8;">{{ email }}</strong> and your new password</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="flash-message flash-{{ category }}">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.reset_password') }}" class="auth-form" id="resetForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="form-group">
                    <label for="otp" style="text-align: center; display: block;">6-Digit Verification Code</label>
                    <input type="text" id="otp" name="otp" required autofocus
                           placeholder="123456" maxlength="6" pattern="[0-9]{6}"
                           style="text-align: center; font-size: 1.6rem; letter-spacing: 5px; font-family: monospace; font-weight: 700;">
                </div>
                <div class="form-group">
                    <label for="password">New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" required minlength="6"
                               placeholder="Min 6 characters">
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('password', this)" title="Show password">
                            👁️
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
                               placeholder="Repeat new password">
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('confirm_password', this)" title="Show password">
                            👁️
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Set New Password</button>
            </form>

            <div style="margin-top: 1.25rem; text-align: center;">
                <form method="POST" action="{{ url_for('auth.resend_otp') }}" style="display: inline;">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <input type="hidden" name="purpose" value="forgot_password"/>
                    <button type="submit" class="btn btn-sm btn-ghost" style="color: #94a3b8;">
                        🔄 Didn't receive code? Resend
                    </button>
                </form>
            </div>

            <div class="auth-footer" style="margin-top: 1.25rem;">
                <p>Remember your password? <a href="{{ url_for('auth.login') }}">Back to Sign In</a></p>
            </div>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(fieldId, btn) {
            const field = document.getElementById(fieldId);
            if (!field) return;
            if (field.type === 'password') {
                field.type = 'text';
                btn.textContent = '🙈';
                btn.title = 'Hide password';
            } else {
                field.type = 'password';
                btn.textContent = '👁️';
                btn.title = 'Show password';
            }
        }
    </script>
</body>
</html>
